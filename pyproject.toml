[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cumuli-core"
version = "0.1.0"
description = "Shared components of the Cumuli 4D Gaussian splatting stack"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "Solipsist Studios Inc." }]
dependencies = ["numpy"]

[project.optional-dependencies]
# Rendering, metrics and image loading. Pure-numpy modules (ply, sh,
# cameras, dataset headers) import without any of these.
torch = ["torch", "gsplat", "torchmetrics", "lpips", "pillow"]
# Decoding .sogst archives and loading dataset images, without torch.
image = ["pillow"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error", "ignore::UserWarning:torchvision", "ignore::DeprecationWarning:lpips", "ignore::UserWarning:lpips"]
markers = ["gpu: needs CUDA and gsplat"]
